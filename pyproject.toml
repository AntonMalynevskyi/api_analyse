[project]
name = "api-analyse"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "folium>=0.20.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.4",
    "requests>=2.31.0",
    "typer>=0.27.3",
]

[project.scripts]
api-analyse = "api_analyse.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
