[project]
name = "api-analyse"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "folium>=0.20.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.4",
    "typer>=0.27.3",
    "retry-requests>=2.0.0",
    "requests-cache>=1.3.3",
    "matplotlib>=3.11.2",
    "urllib3>=2.8.0",
    "requests>=2.34.2",
]

[project.scripts]
api-analyse = "api_analyse.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
